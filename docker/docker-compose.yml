# Dev backing services for the blog baseline.
# postgres + redis + garage (S3-compatible dev storage). Mailpit (dev SMTP) is
# deferred to a later task and kept commented below.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflr/garage:v1.0.1
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
    volumes:
      - ./garage/garage.toml:/etc/garage/garage.toml:ro
      - ./garage/garage-init.sh:/etc/garage/garage-init.sh:ro
      - garagedata:/var/lib/garage
      - ./garage/credentials.env:/etc/garage/credentials.env
    healthcheck:
      test: ["CMD-SHELL", "garage -c /etc/garage/garage.toml status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Deferred to a later task (kept here as a reminder, commented out) ---
  # mailpit:   # image: axllent/mailpit, ports 1025/8025

volumes:
  pgdata:
  redisdata:
  garagedata:
