# Dev backing services for the blog baseline.
# postgres + redis + garage (S3-compatible dev storage). Mailpit (dev SMTP) is
# deferred to a later task and kept commented below.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
    volumes:
      - ./garage/garage.toml:/etc/garage/garage.toml:ro
      - garagedata:/var/lib/garage
    # Distroless image: no shell, so the healthcheck uses CMD form (runs /garage directly).
    # Provisioning runs on the host via docker/garage/garage-init.sh (`docker compose exec`).
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage/garage.toml", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI / HTTP API

volumes:
  pgdata:
  redisdata:
  garagedata:
